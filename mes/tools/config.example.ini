[oracle]
user = <ORACLE_USERNAME>
password = <ORACLE_PASSWORD>
dsn = <HOST>:<PORT>/<SERVICE_NAME>
connect_timeout = 30
call_timeout = 300000
; Oracle 11g 使用 thick；Oracle 12.1+ 可按客户环境选择 thin
mode = thick
; Windows 示例：C:\oracle\instantclient_19_26，也可设置 ORACLE_CLIENT_LIB_DIR
instant_client_dir = <ORACLE_INSTANT_CLIENT_DIRECTORY>
